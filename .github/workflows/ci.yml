# Lint, typecheck, and build gate on every push and PR. Vercel still builds
# with real environment variables before deploying; the build here catches
# breakage earlier and without a deploy attempt.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # One pass over the whole repo: web src, middleware, tests, scripts, and
      # orbit-mobile, which shares this eslint config.
      - run: npm run lint
      # Legacy-design ratchet: unmigrated files live in scripts/legacy-allowlist.txt,
      # which only ever shrinks. See scripts/check-legacy-design.sh.
      - run: bash scripts/check-legacy-design.sh
      # Static prerendering (/, /admin/*) instantiates the Supabase browser
      # client at build time, so the public vars must exist. Placeholders are
      # fine: nothing is fetched during prerender.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # Anonymous smoke suite over the public routes, against the build above.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          CI: "true"
